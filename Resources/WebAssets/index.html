<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>纸阅 · 阅读器原型</title>
<link rel="stylesheet" href="style.css?v=4"/>
</head>
<body data-theme="light">

  <!-- ===== 书架 ===== -->
  <section id="libraryView" class="view">
    <header class="lib-header">
      <h1>纸阅</h1>
      <div class="lib-actions">
        <button id="libThemeBtn" class="icon-btn" title="切换主题">◐</button>
        <button id="libSheetBtn" class="icon-btn" title="排序与视图">⇅</button>
        <button id="importBtn" class="primary-btn">＋ 导入图书</button>
      </div>
    </header>
    <p class="lib-hint">EPUB 阅读器原型 · 图书与进度保存在本机</p>
    <div id="bookGrid" class="book-grid"></div>
    <div id="libEmpty" class="lib-empty hidden">
      <div class="empty-art">📚</div>
      <p>书架空空如也</p>
      <p class="sub">点「导入图书」加入一本 EPUB</p>
    </div>

    <!-- ===== 排序 / 视图面板 ===== -->
    <div id="libSheetMask" class="drawer-mask hidden"></div>
    <aside id="libSheet" class="style-panel">
      <div class="style-row"><span>排序</span></div>
      <div class="opt-list" id="sortOpts">
        <button class="opt" data-sort="recent">最近阅读</button>
        <button class="opt" data-sort="added">添加时间</button>
        <button class="opt" data-sort="title">书名</button>
      </div>
      <div class="style-row"><span>显示</span></div>
      <div class="opt-list" id="viewOpts">
        <button class="opt" data-view="grid">封面网格</button>
        <button class="opt" data-view="list">紧凑列表</button>
      </div>
    </aside>
  </section>

  <!-- ===== 阅读器 ===== -->
  <section id="readerView" class="view hidden">
    <header class="reader-header">
      <button id="backBtn" class="icon-btn back">‹ 书架</button>
      <div class="reader-title"><span id="bookTitle"></span></div>
      <button id="tocBtn" class="icon-btn" title="目录">☰</button>
      <button id="noteBtn" class="icon-btn" title="笔记与高亮">✎</button>
      <button id="searchBtn" class="icon-btn" title="书内搜索">🔍</button>
      <button id="styleBtn" class="icon-btn" title="字号与主题">Aa</button>
    </header>
    <div id="stageWrap">
      <div id="stage"></div>
      <button id="prevBtn" class="page-btn left" title="上一页">‹</button>
      <button id="nextBtn" class="page-btn right" title="下一页">›</button>
      <div id="loading" class="loading hidden"><div class="spinner"></div></div>
    </div>
    <footer class="reader-footer">
      <span id="progressText">…</span>
      <div class="progress-track"><div id="progressBar"></div></div>
    </footer>
  </section>

  <!-- ===== 目录抽屉 ===== -->
  <div id="tocMask" class="drawer-mask hidden"></div>
  <aside id="tocDrawer" class="drawer">
    <div class="drawer-head"><span>目录</span><button id="tocClose" class="icon-btn">✕</button></div>
    <nav id="tocList"></nav>
  </aside>

  <!-- ===== 字号 / 主题面板 ===== -->
  <div id="styleMask" class="drawer-mask hidden"></div>
  <aside id="stylePanel" class="style-panel">
    <div class="style-row">
      <span>字号</span>
      <div class="stepper">
        <button id="fontMinus">A−</button><span id="fontVal">100%</span><button id="fontPlus">A＋</button>
      </div>
    </div>
    <div class="style-row">
      <span>主题</span>
      <div class="theme-picker">
        <button data-theme="light" class="theme-chip light">白</button>
        <button data-theme="sepia" class="theme-chip sepia">黄</button>
        <button data-theme="dark" class="theme-chip dark">夜</button>
      </div>
    </div>
    <div class="style-row"><span>进度</span><span id="panelProgress">—</span></div>
    <button id="deleteBookBtn" class="danger-btn">从书架移除这本书</button>
  </aside>

  <!-- ===== 笔记抽屉（右侧） ===== -->
  <div id="noteMask" class="drawer-mask hidden"></div>
  <aside id="noteDrawer" class="drawer right">
    <div class="drawer-head">
      <span>笔记与高亮</span>
      <span style="display:flex;gap:2px;">
        <button id="noteExportBtn" class="icon-btn" title="导出 Markdown">⇪</button>
        <button id="noteClose" class="icon-btn">✕</button>
      </span>
    </div>
    <div id="noteList" class="note-list"></div>
  </aside>

  <!-- ===== 笔记导出面板 ===== -->
  <div id="exportMask" class="drawer-mask hidden"></div>
  <aside id="exportSheet" class="style-panel export-sheet">
    <div class="style-row"><span>导出笔记（Markdown）</span><span id="expCount" style="color:var(--sub);font-size:13px;"></span></div>
    <textarea id="expText" readonly></textarea>
    <div class="hl-editor-acts">
      <button id="expCopyBtn" class="hl-act save">复制全文</button>
      <button id="expDlBtn" class="hl-act">下载 .md</button>
    </div>
  </aside>

  <!-- ===== 选中文字后的高亮弹窗 ===== -->
  <div id="hlPop" class="hl-pop hidden">
    <div class="hl-row">
      <button class="hl-dot" data-color="yellow" style="--c:#ffd52e" title="黄"></button>
      <button class="hl-dot" data-color="green"  style="--c:#93e768" title="绿"></button>
      <button class="hl-dot" data-color="blue"   style="--c:#5ac8fa" title="蓝"></button>
      <button class="hl-dot" data-color="pink"   style="--c:#ff89b0" title="粉"></button>
      <button class="hl-dot" data-color="purple" style="--c:#c7a2ff" title="紫"></button>
      <span class="hl-sep"></span>
      <button id="hlNoteBtn" class="hl-act">笔记</button>
      <button id="hlCopyBtn" class="hl-act">复制</button>
      <button id="hlRemoveBtn" class="hl-act danger hidden">移除</button>
    </div>
    <div id="hlEditor" class="hl-editor hidden">
      <textarea id="hlText" rows="3" placeholder="写下想法…"></textarea>
      <div class="hl-editor-acts">
        <button id="hlCancelBtn" class="hl-act">取消</button>
        <button id="hlSaveBtn" class="hl-act save">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 搜索抽屉（右侧） ===== -->
  <div id="searchMask" class="drawer-mask hidden"></div>
  <aside id="searchDrawer" class="drawer right">
    <div class="search-head">
      <input id="searchInput" type="search" placeholder="搜索本书内容…" autocomplete="off"/>
      <button id="searchClose" class="icon-btn">✕</button>
    </div>
    <div id="searchStatus" class="search-status"></div>
    <div id="searchResults" class="note-list"></div>
  </aside>

  <input id="fileInput" type="file" accept=".epub,.txt,.text,application/epub+zip,text/plain" multiple hidden/>
  <div id="toast" class="toast hidden"></div>

  <script src="envfix.js?v=1"></script>
  <script src="libs/jszip.min.js"></script>
  <script src="libs/epub.legacy.min.js"></script>
  <script src="sample.js"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
