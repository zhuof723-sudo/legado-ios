name: Legado
options:
  bundleIdPrefix: com.BYEh
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Legado:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReaderAppScaffold
        excludes:
          - README.md
      - path: Modules
      - path: Resources/Assets
        buildPhase: resources
    dependencies:
      - package: LegadoRuleEngine
      - package: SwiftSoup
      - package: Fuzi
    info:
      path: Legado/Info.plist
      properties:
        CFBundleDisplayName: Legado
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.BYEh.eNbcVl2
        TARGETED_DEVICE_FAMILY: "1"
        # 签名相关的 DEVELOPMENT_TEAM / CODE_SIGN_IDENTITY /
        # PROVISIONING_PROFILE_SPECIFIER 刻意不写入仓库（曾经硬编码过，已移除）。
        # CI 签名构建由 secrets 经 xcodebuild 命令行参数注入；
        # 本地在 Xcode 里选一次 Team 即可，请勿把它们提交回来。
packages:
  LegadoRuleEngine:
    path: LegadoRuleEngine
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"
  Fuzi:
    url: https://github.com/cezheng/Fuzi.git
    from: "3.1.3"
