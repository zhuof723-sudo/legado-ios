name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate & provisioning profile
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > signing.p12
          echo "${{ secrets.PROVISION_BASE64 }}" | base64 --decode > signing.mobileprovision
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security import signing.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp signing.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/2d3a97d9-1046-4c06-8463-2a2d0b6a9518.mobileprovision"
          security find-identity -v -p codesigning build.keychain

      - name: Build archive
        run: |
          xcodebuild archive \
            -project Legado.xcodeproj \
            -scheme Legado \
            -archivePath build/Legado.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=VQZ3BY5QXK \
            CODE_SIGN_IDENTITY="Apple Distribution: Miwok Onik (VQZ3BY5QXK)" \
            PROVISIONING_PROFILE_SPECIFIER="EAkqM" \
            CODE_SIGNING_REQUIRED=YES

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Legado.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-ipa
          path: build/export/*.ipa
          if-no-files-found: error
