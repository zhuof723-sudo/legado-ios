name: Legado
options:
  bundleIdPrefix: com.example
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Legado:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReaderAppScaffold
        excludes:
          - README.md
      - path: Modules
      - path: Resources/Assets
        buildPhase: resources
    dependencies:
      - package: LegadoRuleEngine
      - package: SwiftSoup
      - package: Fuzi
    info:
      path: Legado/Info.plist
      properties:
        CFBundleDisplayName: Legado
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # 声明可接收的文档类型：便于「用其他 App 打开 / 分享到 Legado」直接导入
        # （文件选择器本身靠 UTType 过滤，不依赖这里，但外部打开入口需要它）。
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Legado Book Source
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
            CFBundleTypeRole: Viewer
          - CFBundleTypeName: Plain Text
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
            CFBundleTypeRole: Viewer
    settings:
      base:
        # Bundle ID 不写死：默认由上面的 bundleIdPrefix(com.example) + target 名派生，
        # 即 com.example.Legado。要自定义时，本地在 Xcode 里改一次，或让构建用
        # PRODUCT_BUNDLE_IDENTIFIER=... 覆盖（CI workflow 已支持 secrets.BUNDLE_ID）。
        TARGETED_DEVICE_FAMILY: "1"
        # 签名相关的 DEVELOPMENT_TEAM / CODE_SIGN_IDENTITY /
        # PROVISIONING_PROFILE_SPECIFIER 同样不写入仓库。
        # CI 签名构建由 secrets 经 xcodebuild 命令行参数注入；
        # 本地在 Xcode 里选一次 Team 即可，请勿把它们提交回来。
packages:
  LegadoRuleEngine:
    path: LegadoRuleEngine
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"
  Fuzi:
    url: https://github.com/cezheng/Fuzi.git
    from: "3.1.3"
